<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT CUT FOR HNYUQTL</title>
  <meta name="description" content="Gửi link YouTube kèm thời gian, nhận highlight qua email." />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="toast-container" aria-live="polite"></div>

  <div class="app">

    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <h1>YT CUT <span class="accent">FOR HNYUQTL</span></h1>
          <p class="tagline">Gửi link + thời gian, nhận clip qua email</p>
        </div>
        <div class="agent-badge" id="agent-status">
          <span class="agent-dot" id="agent-dot"></span>
          <span id="agent-status-text">Đang kiểm tra...</span>
        </div>
      </div>
    </header>

    <main class="main">

      <form id="request-form" class="card form-card" novalidate autocomplete="off">
        <div class="card-header">
          <h2>Yêu cầu mới</h2>
        </div>

        <div class="field" id="field-source" style="display:none">
          <label for="source-select">Video đã tải <small>(cắt lại, không cần tải)</small></label>
          <select id="source-select">
            <option value="">Tải video mới</option>
          </select>
        </div>

        <div class="field" id="field-url">
          <label for="yt-url">Link YouTube</label>
          <input type="url" id="yt-url" placeholder="https://www.youtube.com/watch?v=..." />
          <span class="live-badge" id="live-badge" style="display:none">🔴 LIVE</span>
          <span class="field-error" id="url-error"></span>
        </div>

        <div class="field" id="field-segments">
          <label for="segments">Đoạn cần cắt <small>(tuỳ chọn — bỏ trống để tải full video)</small></label>
          <textarea id="segments" rows="4" placeholder="Bỏ trống = tải full video&#10;27:00 - 27:35&#10;1:00:45 - 1:01:40"></textarea>
          <div class="field-hint">Định dạng: <code>mm:ss</code> hoặc <code>h:mm:ss</code> — Ngăn cách bằng <code>-</code> <code>~</code> <code>→</code></div>
          <span class="field-error" id="segments-error"></span>
        </div>

        <div class="field-row">
          <div class="field" id="field-email">
            <label for="email">Email nhận kết quả</label>
            <div class="email-input-wrap">
              <input type="email" id="email" list="saved-emails" placeholder="you@email.com" required autocomplete="off" />
              <datalist id="saved-emails"></datalist>
              <button type="button" id="manage-emails-btn" class="btn-manage-emails" title="Quản lý email đã lưu" style="display:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
            </div>
            <div class="saved-emails-panel" id="saved-emails-panel" style="display:none">
              <div class="saved-emails-header">
                <span>Email đã lưu</span>
                <button type="button" id="close-emails-panel" class="btn-close-panel">✕</button>
              </div>
              <div id="saved-emails-list" class="saved-emails-list"></div>
            </div>
            <span class="field-error" id="email-error"></span>
          </div>
          <div class="field" id="field-name">
            <label for="name">Tên <small>(tuỳ chọn)</small></label>
            <input type="text" id="name" value="ql thúi" placeholder="Tên của bạn" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
          <span class="btn-label">Gửi yêu cầu</span>
          <span class="btn-spinner" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a10 10 0 0 1 10 10"/></svg>
          </span>
        </button>
      </form>

      <section class="card status-card" id="status-section">
        <div class="card-header">
          <h2>Lịch sử & Video cần cắt</h2>
          <div class="header-actions">
            <button type="button" class="btn-sync" id="sync-history-btn" title="Tải tất cả lịch sử từ Firebase">
              🔄 Đồng bộ
            </button>
            <button type="button" class="btn-clear" id="clear-history-btn" title="Xoá lịch sử màn hình">
              Xoá
            </button>
          </div>
        </div>
        <div class="history-filter-bar" id="filter-bar">
          <button type="button" class="filter-tab active" data-filter="all">Tất cả</button>
          <button type="button" class="filter-tab" data-filter="processing">⚡ Đang cắt</button>
          <button type="button" class="filter-tab" data-filter="error">⚠️ Lỗi / Cần cắt lại</button>
          <button type="button" class="filter-tab" data-filter="done">✅ Hoàn thành</button>
        </div>
        <div id="status-list" class="status-list">
          <p class="empty-state" id="empty-state">Chưa có yêu cầu nào.</p>
        </div>
      </section>

    </main>

    <footer class="footer">
      <p>YT CUT FOR HNYUQTL</p>
    </footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
