<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Highlight Queue — Download & Cut YouTube Highlights</title>
  <meta name="description" content="Submit YouTube video URLs with timestamps and receive trimmed highlight clips delivered straight to your inbox." />
  <meta name="keywords" content="youtube, download, highlight, clip, trim, queue" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta property="og:title" content="YT Highlight Queue" />
  <meta property="og:description" content="Download and cut YouTube video highlights. Results emailed to you." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated background orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" aria-live="polite"></div>

  <div class="app-wrapper">

    <!-- ─── Header ─── -->
    <header class="app-header">
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#logoGrad)" opacity="0.15"/>
            <polygon points="20,14 20,34 35,24" fill="url(#logoGrad)"/>
            <rect x="2" y="2" width="44" height="44" rx="12" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
          </svg>
        </div>
        <h1>YT Highlight <span class="gradient-text">Queue</span></h1>
      </div>
      <p class="tagline">Submit a YouTube video with timestamps — get trimmed highlights in your inbox.</p>
      <div class="agent-status" id="agent-status">
        <span class="agent-dot" id="agent-dot"></span>
        <span id="agent-status-text">Checking agent...</span>
      </div>
    </header>

    <!-- ─── Form Card ─── -->
    <main>
      <form id="request-form" class="glass-card form-card" novalidate autocomplete="off">
        <h2 class="card-title">New Request</h2>

        <!-- YouTube URL -->
        <div class="field">
          <label for="yt-url">YouTube URL</label>
          <div class="input-wrap has-icon">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.8 8.001a2.749 2.749 0 0 0-1.935-1.946C18.165 5.5 12 5.5 12 5.5s-6.165 0-7.865.555A2.749 2.749 0 0 0 2.2 8.001 28.89 28.89 0 0 0 1.75 12a28.89 28.89 0 0 0 .45 3.999 2.749 2.749 0 0 0 1.935 1.946C5.835 18.5 12 18.5 12 18.5s6.165 0 7.865-.555a2.749 2.749 0 0 0 1.935-1.946A28.89 28.89 0 0 0 22.25 12a28.89 28.89 0 0 0-.45-3.999ZM9.75 15.02V8.98L15.5 12l-5.75 3.02Z"/></svg>
            </span>
            <input type="url" id="yt-url" placeholder="https://www.youtube.com/watch?v=..." required />
          </div>
          <span class="field-error" id="url-error"></span>
        </div>

        <!-- Source Selector (hidden by default) -->
        <div class="field source-selector" id="source-selector-field" style="display:none;">
          <label>Hoặc chọn video đã tải <small>(skip download)</small></label>
          <select id="source-select">
            <option value="">-- Tải video mới --</option>
          </select>
        </div>

        <!-- Time Segments -->
        <div class="field">
          <label for="segments">Time Segments <small>(one per line)</small></label>
          <textarea id="segments" rows="5" placeholder="27:00 - 27:35&#10;1:00:45 - 1:01:40&#10;0:05 - 1:30" required></textarea>
          <span class="field-hint">Formats: <code>mm:ss</code>, <code>h:mm:ss</code>, dots or colons. Separators: <code>-</code> <code>→</code> <code>~</code></span>
          <span class="field-error" id="segments-error"></span>
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap has-icon">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4.236-8 4.882-8-4.882V6h16v2.236Z"/></svg>
            </span>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <span class="field-error" id="email-error"></span>
        </div>

        <!-- Name -->
        <div class="field">
          <label for="name">Name <small>(optional)</small></label>
          <div class="input-wrap has-icon">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12Zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8Z"/></svg>
            </span>
            <input type="text" id="name" placeholder="Your name" />
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn" class="btn-submit">
          <span class="btn-label">Submit Request</span>
          <span class="btn-spinner" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a10 10 0 0 1 10 10"/></svg>
          </span>
        </button>
      </form>

      <!-- ─── Status Section ─── -->
      <section class="glass-card status-card" id="status-section">
        <div class="status-header">
          <h2 class="card-title">Your Requests</h2>
          <button type="button" class="btn-clear" id="clear-history-btn" title="Clear history">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12ZM8 9h8v10H8V9Zm7.5-5-1-1h-5l-1 1H5v2h14V4h-3.5Z"/></svg>
            Clear
          </button>
        </div>
        <div id="status-list" class="status-list">
          <p class="empty-state" id="empty-state">No requests yet. Submit one above!</p>
        </div>
      </section>
    </main>

    <!-- ─── Footer ─── -->
    <footer class="app-footer">
      <p>YT Highlight Queue &middot; Highlights delivered to your inbox</p>
    </footer>
  </div>

  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
